[build]
  publish = "."

# ============================================================
# STAGING GUARD — DELETE THIS BLOCK BEFORE ATTACHING THE DOMAIN
# Keeps jayguzmusic.netlify.app out of Google while we review.
# The header overrides the `index, follow` meta tag in each page.
# ============================================================
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Canonical domain: non-www → www
[[redirects]]
  from = "https://jayguzmanmusicandevents.com/*"
  to = "https://www.jayguzmanmusicandevents.com/:splat"
  status = 301
  force = true

# Old domain → new. Inert until jayguzmusic.com's DNS points at this site
# (it currently serves a separate Wix site), but in place so the switch
# forwards visitors and link equity the moment it does.
[[redirects]]
  from = "https://jayguzmusic.com/*"
  to = "https://www.jayguzmanmusicandevents.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.jayguzmusic.com/*"
  to = "https://www.jayguzmanmusicandevents.com/:splat"
  status = 301
  force = true

# ============================================================
# The 14 routing rules that used to live here are gone.
#
# Every page now sits at <url>/index.html, so the file path IS the URL
# and no rewrite is needed to serve it. That also makes the site
# portable — these clean URLs resolve on any static host, which the
# rewrite-based layout could not do.
#
# The /events/* 301s went too. Those paths were only ever an internal
# file location, never a public URL, and nothing has been indexed:
# the staging URL has carried X-Robots-Tag noindex throughout.
# ============================================================
